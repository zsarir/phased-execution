<!doctype html>
<meta charset="utf-8" />
<!-- viewport-fit=cover pairs with the safe-area padding in base.css: installed
     on a phone the app draws under the status bar, and the insets put it back. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>Phase Console</title>

<!-- Installed to a home screen, this is an app rather than a page. On iOS that
     is also the only way a browser notification is allowed to exist, which is
     the difference between answering an approval from bed and not. -->
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Phase" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1b22" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#e4eae8" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230e1b22'/%3E%3Cpath d='M7 16h18' stroke='%23ffb627' stroke-width='2.5' fill='none'/%3E%3Ccircle cx='7' cy='16' r='3.4' fill='%233fb68b'/%3E%3Ccircle cx='25' cy='16' r='3.4' fill='%23ffb627'/%3E%3C/svg%3E" />

<link rel="preload" href="/fonts/archivo-narrow.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/fonts/public-sans.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/styles/tokens.css" />
<link rel="stylesheet" href="/styles/base.css" />
<link rel="stylesheet" href="/styles/components.css" />
<link rel="stylesheet" href="/styles/views.css" />
<!-- Last, and it has to stay last: the phone sheet raises font sizes and hit
     areas that the sheets above set for a pointer, and it wins by source order
     rather than by `!important`. -->
<link rel="stylesheet" href="/styles/mobile.css" />

<div id="app"></div>

<script type="importmap">
  {
    "imports": {
      "preact": "/vendor/preact.module.js",
      "preact/hooks": "/vendor/hooks.module.js",
      "htm": "/vendor/htm.module.js",
      "marked": "/vendor/marked.esm.js"
    }
  }
</script>
<script type="module" src="/app.js"></script>
