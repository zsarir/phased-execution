name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  skill-scripts:
    name: bash engine (bats on macOS system bash 3.2)
    # macos-latest on purpose: tests/helpers/test_helper.bash forces every
    # script under test onto /bin/bash — macOS system bash 3.2, the real target
    # runtime. On ubuntu /bin/bash is 5.x and a 3.2 regression would slip.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats + shellcheck
        run: brew install bats-core shellcheck
      - name: Shell suites (shellcheck + unit + integration)
        run: tests/run-tests.sh

  skill-scripts-linux:
    name: bash engine (bats on Linux bash 5 + GNU coreutils)
    # The other half of the portability claim: the same scripts under Linux's
    # /bin/bash and GNU userland, where every BSD-only flag would surface.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats + shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q bats shellcheck
      - name: Shell suites (shellcheck + unit + integration)
        run: tests/run-tests.sh

  console:
    name: console (${{ matrix.os }} — server suite, client suite, build gate)
    runs-on: ${{ matrix.os }}
    strategy:
      # Both platforms are release gates; one failing must not mask the other.
      fail-fast: false
      matrix:
        # ubuntu is not a nicety: Linux/WSL2 is a supported install target, and
        # npm ci compiling node-pty from source there (no Linux prebuilds ship)
        # is part of what this job proves.
        os: [macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not the 22.18 runtime floor: the SUITE leans on node:test
          # semantics that differ on 22 (a parked promise with only unref'd
          # handles drains the loop there and cancels every pending test —
          # diagnosed on 22.23.1). The floor itself stays enforced by the
          # version gates, and pack-check builds on 22 to prove the toolchain.
          node-version: '24'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - name: Operator-shaped environment (the suite assumes a signed-in machine)
        # The server suite is written against a real operator machine: the
        # runner's preflight spawns `claude auth status` and refuses every run
        # unless it answers "signed in" (145 tests cascade off that), fixture
        # repos commit (git identity), and skills discovery reads ~/.claude.
        # Provide those three facts; everything else the tests inject.
        working-directory: .
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          mkdir -p "$HOME/.claude/skills" "$HOME/bin"
          cat > "$HOME/bin/claude" <<'EOF'
          #!/usr/bin/env bash
          # Enough `claude` for the environment probes. Real sessions are
          # injected as SpawnFn stubs, so any other invocation is a bug
          # worth failing loudly on.
          if [ "${1:-}" = "auth" ] && [ "${2:-}" = "status" ]; then
            echo '{"loggedIn": true, "email": "ci@example.com", "authMethod": "ci", "orgName": "ci", "subscriptionType": "ci"}'
            exit 0
          fi
          # The usage poller asks the installed CLI's version once, to shape
          # its User-Agent. Any version-shaped answer will do in CI.
          if [ "${1:-}" = "--version" ]; then
            echo '2.1.0 (ci stub)'
            exit 0
          fi
          echo "fake claude: unsupported invocation: $*" >&2
          exit 1
          EOF
          chmod +x "$HOME/bin/claude"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Server suite (minus the timing-sensitive files)
        # Serial files on purpose: the suite is documented load-sensitive
        # (terminal reattach is only the loudest case), and a 3-core runner
        # under 40-odd parallel files hits races a dev machine's cores absorb.
        run: node --test --test-concurrency=1 $(ls test/*.test.ts | grep -vE 'terminal.test.ts|spawn-protocol.test.ts|runner-parallel.test.ts')
      - name: Timing-sensitive files, isolated with one retry each
        # terminal: the known reattach flake under load. spawn-protocol: the
        # operator-echo test races a 60ms send against the stub session's
        # natural close, and runner timing sometimes loses that race.
        # runner-parallel: two tests here measure scheduling against real
        # sleeps — 'a stranger's live lock' (400ms) and 'a queued second lane
        # does not repaint a run that is still driving its first'. The latter
        # failed the v1.2.0 release on macOS while the CI workflow passed the
        # same job on the same commit concurrently: both workflows fire on a
        # tagged push and race for macOS runners, so this bites hardest exactly
        # at release time.
        run: |
          node --test test/terminal.test.ts || node --test test/terminal.test.ts
          node --test test/spawn-protocol.test.ts || node --test test/spawn-protocol.test.ts
          node --test test/runner-parallel.test.ts || node --test test/runner-parallel.test.ts
      - name: Client suite
        run: npm run test:client
      - name: Client typecheck
        run: npm run typecheck:client
      - name: Client lint + format check
        run: npm run lint:client && npm run format:check
      - name: Build
        run: npm run build
      - name: Build gate
        run: npm run check:dist

  scrub:
    name: public-repo scrub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/scrub.sh

  pack-check:
    name: tarball contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pack (runs the full client build via prepack)
        run: npm pack
      - name: Assert contents
        run: bash .github/scripts/assert-tarball.sh phase-console-*.tgz
