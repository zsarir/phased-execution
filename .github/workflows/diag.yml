name: diag
# TEMPORARY — single-file diagnosis of the runner-only cancellations. Deleted
# once the console job is green.
on: workflow_dispatch

jobs:
  one-file:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Operator-shaped environment
        working-directory: .
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          mkdir -p "$HOME/.claude/skills" "$HOME/bin"
          cat > "$HOME/bin/claude" <<'EOF'
          #!/usr/bin/env bash
          if [ "${1:-}" = "auth" ] && [ "${2:-}" = "status" ]; then
            echo '{"loggedIn": true, "email": "ci@example.com", "authMethod": "ci", "orgName": "ci", "subscriptionType": "ci"}'
            exit 0
          fi
          echo "fake claude: unsupported invocation: $*" >&2
          exit 1
          EOF
          chmod +x "$HOME/bin/claude"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Environment facts
        run: |
          echo "node=$(node -p 'process.versions.node')"
          echo "XPC_SERVICE_NAME=${XPC_SERVICE_NAME:-<unset>}"
          echo "TERM=${TERM:-<unset>}  CI=${CI:-<unset>}"
          command -v launchctl tailscale claude || true
      - name: hook-decisions, full TAP
        run: node --test --test-concurrency=1 --test-reporter=tap test/hook-decisions.test.ts 2>&1 | tail -60 || true
      - name: notifications, tail
        run: node --test --test-concurrency=1 test/notifications.test.ts 2>&1 | tail -30 || true
